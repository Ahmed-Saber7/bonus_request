<section>
  <h2>أنواع العقود والشروط الديناميكية</h2>
  <p>كل نوع عقد له شروطه وأحكامه. اختيار النوع في عقد الإيجار ينزّل الشروط تلقائياً.</p>
  <ul>
    <li>Real Estate &gt; Configuration &gt; أنواع العقود والشروط</li>
    <li>في العقد: اختر نوع العقد (الشروط) وستُنسخ الشروط إلى حقل الشروط</li>
    <li>تعديل شروط النوع لا يغيّر العقود القديمة إلا بزر التحديث</li>
  </ul>
</section>
